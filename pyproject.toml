[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-supply-chain-platform"
version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]

# Add this section below to handle the flat-layout multi-package setup:
[tool.setuptools.packages.find]
include = ["api*", "app*", "cache*", "debug*", "agents*", "graphs*", "models*", "routing*", "services*", "ingestion*", "workflow*", "repository*"]